<!doctype html>
<html lang="ru" data-bg="night" data-accent="yellow" data-style="cartoon">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Игротека</title>
  <meta name="description" content="14 игр для компании по ссылке: Слова, Крокодил, Мафия, Бункер, Покер, Дурак, Уно, шахматы, шашки, го, маджонг, рулетка и стратегия «Империи». До 10 игроков, ничего не нужно устанавливать.">
  <meta name="theme-color" content="#1b1442">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Игротека">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Превью ссылки в iMessage / Telegram / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Игротека — играем вместе!">
  <meta property="og:description" content="Мафия, Бункер, Крокодил, Уно, Покер, шахматы, стратегия и ещё 7 игр. Открой ссылку — и ты уже в игре.">
  <meta property="og:image" content="https://abyzer-1337.github.io/Slova-Duel/icons/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/games2.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <main id="app">

    <section class="screen" id="home" hidden>
      <div class="topline">
        <button class="profile-chip" type="button" data-action="profile"><span class="me-ava"></span><span class="me-name"></span><span class="pencil">✎</span></button>
        <span class="spacer"></span>
        <button class="icon-btn" type="button" data-action="lang" id="lang-btn" data-i18n-aria="profile.language">🌐</button>
        <button class="icon-btn" type="button" data-action="sound" id="sound-btn" data-i18n-aria="profile.sound">🔊</button>
      </div>
      <header class="hero">
        <div class="logo" id="logo"></div>
        <p class="tagline" data-i18n="home.tagline"></p>
      </header>
      <div class="games-row" id="games-row"></div>
      <nav class="menu">
        <button class="btn big primary" type="button" data-action="create">🎉 <span data-i18n="home.create"></span></button>
        <button class="btn big" type="button" data-action="join">🔑 <span data-i18n="home.join"></span></button>
        <button class="btn big" type="button" data-action="offline">🤖 <span data-i18n="home.offline"></span></button>
        <button class="btn big" type="button" data-action="split">📱 <span data-i18n="home.split"></span></button>
      </nav>
      <p class="muted center small" data-i18n="home.hint"></p>
      <div class="a2hs" id="a2hs" hidden>
        <span><span data-i18n="home.a2hs"></span></span>
        <button class="icon-btn" type="button" data-action="a2hs-close" data-i18n-aria="common.close">✕</button>
      </div>
    </section>

    <section class="screen" id="profile" hidden>
      <div class="topbar">
        <button class="btn ghost" type="button" data-action="home">← <span data-i18n="common.back"></span></button>
        <h2 data-i18n="profile.title"></h2>
      </div>
      <div id="profile-body"></div>
    </section>

    <section class="screen" id="join" hidden>
      <div class="topbar">
        <button class="btn ghost" type="button" data-action="home">← <span data-i18n="common.back"></span></button>
        <h2 data-i18n="join.title"></h2>
      </div>
      <form class="card form" id="join-form" autocomplete="off">
        <p class="invited" id="join-invite" hidden data-i18n="join.invited"></p>
        <div class="join-me"><span class="me-ava"></span><button class="btn small" type="button" data-action="profile" data-i18n="join.changeAvatar"></button></div>
        <label class="field">
          <span data-i18n="join.code"></span>
          <input id="join-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" data-i18n-ph="join.codePh">
        </label>
        <label class="field">
          <span data-i18n="profile.name"></span>
          <input id="join-name" maxlength="16" autocomplete="nickname" data-i18n-ph="profile.namePh">
        </label>
        <button class="btn big primary" type="submit" data-i18n="join.go"></button>
        <p class="muted" id="join-status" aria-live="polite"></p>
      </form>
    </section>

    <section class="screen" id="room" hidden></section>

    <section class="screen" id="game" hidden>
      <header class="gbar">
        <button class="icon-btn" type="button" data-action="quit" data-i18n-aria="game.quit">✕</button>
        <div class="gtitle"><span class="gicon"></span><b class="gname"></b><span class="ginfo"></span></div>
      </header>
      <div class="gview" id="gview"></div>
    </section>

  </main>
  <div id="results" class="results-wrap" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <noscript>Для игры нужен включённый JavaScript.</noscript>
</body>
</html>
