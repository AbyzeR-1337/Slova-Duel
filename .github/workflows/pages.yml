name: Тесты и публикация

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # Публикуем только основную ветку репозитория.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Проверить, включены ли GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages ещё не включены для Actions. Откройте Settings → Pages → Source: GitHub Actions и запустите этот workflow заново."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - name: Собрать сайт
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest .nojekyll css js vendor icons _site/
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
